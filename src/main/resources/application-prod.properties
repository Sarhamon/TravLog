# 운영 프로파일 — MySQL
# DB 접속 정보는 환경변수로 주입 (커밋된 비밀번호 없음).
#   DB_URL       예) jdbc:mysql://localhost:3306/travlog?useUnicode=true&characterEncoding=utf8
#   DB_USERNAME  예) travlog
#   DB_PASSWORD  예) (운영 비밀번호)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 학습 단계: 엔티티 변경 시 컬럼/테이블 자동 갱신.
# 실제 운영에서는 validate + Flyway/Liquibase 마이그레이션 권장.
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false
